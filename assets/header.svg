<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Artyom — Backend and Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <!-- мягкий туман/дымка внизу, имитация природы -->
    <radialGradient id="mist" cx="50%" cy="120%" r="70%">
      <stop offset="0%" stop-color="#16202b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- одна капля дождя -->
    <g id="drop">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <style>
      .t-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .t-sub  { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .blink  { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- фон -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#mist)"/>

  <!-- ===== ДОЖДЬ (анимированный, SMIL) ===== -->
  <g filter="url(#soft)">
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="60,-20; 55,320" dur="1.4s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="150,-20; 145,320" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="245,-20; 240,320" dur="1.2s" begin="0.7s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="330,-20; 326,320" dur="2.1s" begin="0.1s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="420,-20; 415,320" dur="1.5s" begin="0.9s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="520,-20; 516,320" dur="1.7s" begin="0.4s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="615,-20; 610,320" dur="1.3s" begin="1.1s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="700,-20; 696,320" dur="2.0s" begin="0.2s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="790,-20; 785,320" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="885,-20; 880,320" dur="1.25s" begin="0.5s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="975,-20; 970,320" dur="1.9s" begin="1.3s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="1060,-20; 1055,320" dur="1.45s" begin="0.6s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="1145,-20; 1140,320" dur="1.65s" begin="1.0s" repeatCount="indefinite"/></use>
    <!-- второй, более далёкий слой дождя -->
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="100,-20; 96,320" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="290,-20; 286,320" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="470,-20; 466,320" dur="2.3s" begin="0.4s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="660,-20; 656,320" dur="2.7s" begin="1.2s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="840,-20; 836,320" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="1020,-20; 1016,320" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.3"><animateTransform attributeName="transform" type="translate" values="1180,-20; 1176,320" dur="2.55s" begin="0.1s" repeatCount="indefinite"/></use>
  </g>

  <!-- ===== ТЕКСТ ===== -->
  <text x="70" y="150" class="t-name" font-size="58" fill="#e6edf3">artyom</text>
  <text x="272" y="150" class="t-name" font-size="58" fill="#89b4fa">&lt;/&gt;</text>

  <!-- подзаголовок: отдельные элементы с явными x, чтобы везде рендерились по порядку -->
  <text x="72" y="202" class="t-sub" font-size="26" fill="#89b4fa">$</text>
  <text x="96" y="202" class="t-sub" font-size="26" fill="#8b94a3">backend_dev</text>
  <rect x="278" y="182" width="11" height="24" fill="#89b4fa" class="blink"/>

  <!-- тонкая разделительная линия -->
  <line x1="70" y1="230" x2="1130" y2="230" stroke="#21262d" stroke-width="1"/>

  <text x="70" y="262" class="t-sub" font-size="17" fill="#6e7681">PHP · Python · Git · GitHub · Linux · VS Code</text>
</svg>
