<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Artyom — Backend and Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e141b"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <!-- солнце -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd66b" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#ffc95a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffc95a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd66b" stop-opacity="0"/>
    </radialGradient>

    <!-- плотное облако: светлое ядро + мягкие края -->
    <radialGradient id="cloudBody" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#eef3f8" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#c8d3de" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#8a97a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudPuff" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f6f9fc" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#c2cdd9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a97a6" stop-opacity="0"/>
    </radialGradient>

    <!-- мягкие края -->
    <filter id="softCloud" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softTree" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
    <!-- лёгкий блюр листвы -->
    <filter id="foliage" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>

    <!-- свечение + мягкая тень для текста -->
    <filter id="textGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8fb6ff" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="textGlowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8fb6ff" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- капля дождя: тонкая светлая черта -->
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0f2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cfe0f2" stop-opacity="0.9"/>
    </linearGradient>
    <g id="drop">
      <rect x="0" y="0" width="1.6" height="18" rx="0.8" fill="url(#dropGrad)"/>
    </g>

    <style>
      .t-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .t-sub  { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .blink  { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- фон -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- ===== СОЛНЦЕ (правый верхний угол) ===== -->
  <g>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="9s" repeatCount="indefinite"/>
    <circle cx="1150" cy="46" r="130" fill="url(#sunGlow)"/>
    <circle cx="1150" cy="46" r="44" fill="url(#sunHalo)"/>
    <circle cx="1150" cy="46" r="30" fill="#fff6d0"/>
  </g>

  <!-- ===== ОБЛАКА (крупные, яркие, в центре — правее текста) ===== -->
  <g filter="url(#softCloud)">
    <!-- большое центральное облако -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 24,0; 0,0" dur="46s" repeatCount="indefinite"/>
      <ellipse cx="760" cy="112" rx="158" ry="70" fill="url(#cloudBody)"/>
      <ellipse cx="660" cy="146" rx="126" ry="60" fill="url(#cloudPuff)"/>
      <ellipse cx="862" cy="146" rx="132" ry="62" fill="url(#cloudPuff)"/>
      <ellipse cx="720" cy="86" rx="100" ry="54" fill="url(#cloudPuff)"/>
      <ellipse cx="852" cy="96" rx="92" ry="50" fill="url(#cloudPuff)"/>
    </g>
    <!-- левое облако (выше текста, слабое) -->
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; -18,0; 0,0" dur="58s" repeatCount="indefinite"/>
      <ellipse cx="330" cy="58" rx="104" ry="40" fill="url(#cloudBody)"/>
      <ellipse cx="272" cy="74" rx="80" ry="34" fill="url(#cloudPuff)"/>
      <ellipse cx="392" cy="72" rx="82" ry="34" fill="url(#cloudPuff)"/>
    </g>
    <!-- правое облако -->
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,0; 0,0" dur="64s" repeatCount="indefinite"/>
      <ellipse cx="1050" cy="120" rx="122" ry="52" fill="url(#cloudBody)"/>
      <ellipse cx="985" cy="146" rx="92" ry="44" fill="url(#cloudPuff)"/>
      <ellipse cx="1112" cy="144" rx="94" ry="45" fill="url(#cloudPuff)"/>
      <ellipse cx="1052" cy="98" rx="74" ry="40" fill="url(#cloudPuff)"/>
    </g>
  </g>

  <!-- ===== ЗЕМЛЯ (холм справа) ===== -->
  <path d="M560 300 C740 299 830 288 940 282 C1060 276 1140 275 1200 275 L1200 300 Z" fill="#0f1712"/>
  <path d="M560 300 C740 299 830 288 940 282 C1060 276 1140 275 1200 275" fill="none" stroke="#1c2b21" stroke-width="1.4"/>

  <!-- ===== ДУБ (один большой, на земле) ===== -->
  <!-- крона: задний слой -->
  <g filter="url(#foliage)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 3.6,0; 0,0" dur="11s" repeatCount="indefinite"/>
    <circle cx="1000" cy="132" r="78" fill="#17291e"/>
    <circle cx="928" cy="154" r="56" fill="#17291e"/>
    <circle cx="1074" cy="152" r="58" fill="#17291e"/>
    <circle cx="963" cy="98" r="52" fill="#17291e"/>
    <circle cx="1040" cy="96" r="54" fill="#17291e"/>
  </g>

  <!-- ствол и ветви (статичные) -->
  <g>
    <path d="M984 279 C982 252 986 230 989 210 C992 204 1012 204 1015 210 C1018 232 1022 254 1020 279 C1010 283 994 283 984 279 Z" fill="#453628"/>
    <g stroke="#453628" fill="none" stroke-linecap="round">
      <path d="M1002 212 C1000 184 995 162 984 144" stroke-width="10"/>
      <path d="M1002 212 C1006 182 1016 160 1032 142" stroke-width="10"/>
      <path d="M994 226 C980 208 960 192 938 180" stroke-width="7"/>
      <path d="M1012 228 C1030 210 1052 196 1074 184" stroke-width="7"/>
      <path d="M984 144 C976 132 966 124 954 118" stroke-width="4.5"/>
      <path d="M1032 142 C1042 130 1052 124 1064 120" stroke-width="4.5"/>
    </g>
  </g>

  <!-- крона: передний слой -->
  <g filter="url(#foliage)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 3.6,0; 0,0" dur="11s" repeatCount="indefinite"/>
    <circle cx="1004" cy="142" r="68" fill="#17291e"/>
    <circle cx="940" cy="168" r="46" fill="#17291e"/>
    <circle cx="1064" cy="166" r="48" fill="#17291e"/>
    <circle cx="974" cy="110" r="44" fill="#17291e"/>
    <circle cx="1036" cy="108" r="46" fill="#17291e"/>
    <circle cx="918" cy="186" r="24" fill="#17291e"/>
    <circle cx="1086" cy="182" r="24" fill="#17291e"/>
    <circle cx="988" cy="190" r="22" fill="#17291e"/>
    <circle cx="1030" cy="192" r="20" fill="#17291e"/>
  </g>

  <!-- падающие листики -->
  <g fill="#2f5138">
    <ellipse cx="950" cy="150" rx="2.3" ry="1.2">
      <animate attributeName="cx" values="950;942;950" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,135" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1042" cy="120" rx="2.3" ry="1.2">
      <animate attributeName="cx" values="1042;1050;1042" dur="2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 3,165" dur="7s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="7s" begin="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1002" cy="176" rx="2.1" ry="1.1">
      <animate attributeName="cx" values="1002;996;1002" dur="2.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,110" dur="5.5s" begin="4.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.85;1" dur="5.5s" begin="4.1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ===== ДОЖДЬ (капли только в ПРАВОЙ части — не над текстом) ===== -->
  <g filter="url(#softCloud)">
    <!-- передний слой: быстрые, яркие -->
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="600,-20; 595,320" dur="0.85s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="700,-20; 695,320" dur="0.92s" begin="0.2s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="820,-20; 814,320" dur="0.8s" begin="0.5s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="940,-20; 934,320" dur="0.88s" begin="0.35s" repeatCount="indefinite"/></use>
    <use href="#drop"><animateTransform attributeName="transform" type="translate" values="1120,-20; 1114,320" dur="0.86s" begin="0.65s" repeatCount="indefinite"/></use>
    <!-- средний слой -->
    <use href="#drop" opacity="0.62"><animateTransform attributeName="transform" type="translate" values="650,-20; 646,320" dur="1.25s" begin="0.15s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.62"><animateTransform attributeName="transform" type="translate" values="780,-20; 775,320" dur="1.35s" begin="0.55s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.62"><animateTransform attributeName="transform" type="translate" values="900,-20; 895,320" dur="1.2s" begin="0.75s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.62"><animateTransform attributeName="transform" type="translate" values="1010,-20; 1005,320" dur="1.3s" begin="0.05s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.62"><animateTransform attributeName="transform" type="translate" values="1160,-20; 1156,320" dur="1.28s" begin="1.0s" repeatCount="indefinite"/></use>
    <!-- дальний слой: медленные, бледные -->
    <use href="#drop" opacity="0.34"><animateTransform attributeName="transform" type="translate" values="620,-20; 617,320" dur="1.9s" begin="0.3s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.34"><animateTransform attributeName="transform" type="translate" values="740,-20; 737,320" dur="2.1s" begin="0.6s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.34"><animateTransform attributeName="transform" type="translate" values="870,-20; 867,320" dur="2.0s" begin="1.1s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.34"><animateTransform attributeName="transform" type="translate" values="980,-20; 977,320" dur="2.2s" begin="0.25s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.34"><animateTransform attributeName="transform" type="translate" values="1090,-20; 1087,320" dur="1.95s" begin="0.85s" repeatCount="indefinite"/></use>
    <use href="#drop" opacity="0.34"><animateTransform attributeName="transform" type="translate" values="1180,-20; 1177,320" dur="2.05s" begin="1.4s" repeatCount="indefinite"/></use>
  </g>

  <!-- ===== ТЕКСТ (белый, с мягкой тенью и свечением) ===== -->
  <g filter="url(#textGlow)">
    <text x="70" y="150" class="t-name" font-size="58" fill="#ffffff">artyom</text>
    <text x="272" y="150" class="t-name" font-size="58" fill="#ffffff">&lt;/&gt;</text>
  </g>

  <!-- подзаголовок: отдельные элементы с явными x, чтобы везде рендерились по порядку -->
  <g filter="url(#textGlowSoft)">
    <text x="72" y="202" class="t-sub" font-size="26" fill="#ffffff">$</text>
    <text x="96" y="202" class="t-sub" font-size="26" fill="#ffffff">backend_dev</text>
    <rect x="278" y="182" width="11" height="24" fill="#ffffff" class="blink"/>
  </g>

  <text x="70" y="262" class="t-sub" font-size="17" fill="#ffffff" fill-opacity="0.72" filter="url(#textGlowSoft)">PHP · Python · Git · GitHub · Linux · VS Code</text>
</svg>
