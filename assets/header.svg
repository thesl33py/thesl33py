<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Artyom — Backend and Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <!-- мягкое облако/туман -->
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b3a4a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2b3a4a" stop-opacity="0"/>
    </radialGradient>

    <!-- цветная полоса сияния (аврора) -->
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#98c379" stop-opacity="0"/>
      <stop offset="50%" stop-color="#98c379" stop-opacity="1"/>
      <stop offset="100%" stop-color="#98c379" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#89b4fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </linearGradient>

    <!-- размытие для полос сияния -->
    <filter id="mist" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <style>
      .t-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; }
      .t-sub  { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .blink  { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- фон -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- ===== АВРОРА (медленные размытые полосы сияния) ===== -->
  <g filter="url(#mist)">
    <rect x="-300" y="20" width="520" height="46" rx="23" fill="url(#aurora)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="-260,0; 1300,0" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="13s" repeatCount="indefinite"/>
    </rect>
    <rect x="-300" y="52" width="380" height="34" rx="17" fill="url(#aurora2)" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" values="1280,0; -320,0" dur="34s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="17s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== ТУМАН (медленно проплывающие облачка) ===== -->
  <g>
    <ellipse cx="0" cy="150" rx="300" ry="90" fill="url(#cloud)">
      <animateTransform attributeName="transform" type="translate" values="-260,0; 1320,0" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="210" rx="260" ry="70" fill="url(#cloud)" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="1300,0; -280,0" dur="62s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="120" rx="200" ry="60" fill="url(#cloud)" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="-200,0; 1340,0" dur="75s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ===== ТЕКСТ ===== -->
  <text x="70" y="150" class="t-name" font-size="58" fill="#e6edf3">artyom</text>
  <text x="272" y="150" class="t-name" font-size="58" fill="#89b4fa">&lt;/&gt;</text>

  <!-- подзаголовок: отдельные элементы с явными x, чтобы везде рендерились по порядку -->
  <text x="72" y="202" class="t-sub" font-size="26" fill="#89b4fa">$</text>
  <text x="96" y="202" class="t-sub" font-size="26" fill="#8b94a3">backend_dev</text>
  <rect x="278" y="182" width="11" height="24" fill="#89b4fa" class="blink"/>

  <!-- тонкая разделительная линия -->
  <line x1="70" y1="230" x2="1130" y2="230" stroke="#21262d" stroke-width="1"/>

  <text x="70" y="262" class="t-sub" font-size="17" fill="#6e7681">PHP · Python · Git · GitHub · Linux · VS Code</text>
</svg>
