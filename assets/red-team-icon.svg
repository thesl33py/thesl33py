<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
  <defs>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#f85149" flood-opacity="0.75"/>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="#f85149" stroke-width="1.7" stroke-linecap="round">
    <!-- внешнее кольцо прицела -->
    <circle cx="12" cy="12" r="8.6"/>
    <!-- внутреннее кольцо -->
    <circle cx="12" cy="12" r="3.4" stroke-width="1.4"/>
